function asegurarEstructura() {
  const lunes = lunesDeEstaSemana();
  if (!S || typeof S !== "object") S = {};
  if (S.semanaInicio !== lunes) S = { semanaInicio: lunes, dias: {}, aguaUltima: 0, historial: S.historial || [] };
  if (!S.dias) S.dias = {};
  if (!S.aguaUltima) S.aguaUltima = 0;
  if (!S.historial) S.historial = [];         // permanente: no se borra cada semana
  if (!S.dias[HOY]) S.dias[HOY] = {};
  D = S.dias[HOY];
  ["hechas","checks","cacasLisa","paseoCaluga","metodos","horasReales","aplazos"].forEach(k => { if(!D[k]) D[k] = {}; });
  if (!D.registros) D.registros = [];
  if (!D.timers) D.timers = [];
  if (!D.ultimaPipi) D.ultimaPipi = Date.now();
}
asegurarEstructura();

function guardar() {
  try { localStorage.setItem("pewitas", JSON.stringify(S)); } catch(e){}
  if (db && syncListo) db.ref("estado").set(S).catch(()=>{});
}
function conectarSync() {
  if (!db) { syncListo = true; return; }
  db.ref("estado").on("value", (snap) => {
    const v = snap.val(); const primera = !syncListo;
    if (v && typeof v === "object") S = v;
    asegurarEstructura(); syncListo = true;
    if (primera && !v) guardar();
    try { localStorage.setItem("pewitas", JSON.stringify(S)); } catch(e){}
    render();
  }, () => { syncListo = true; render(); });
}

// ═══════════════════ MODELO DE CACA ═══════════════════
// Prior inicial (cachorra Corgi Pembroke, 4 meses, 5 kg, Biofresh 5 veces/día):
// el reflejo gastrocólico dispara la caca ~5-30 min después de comer; el juego y el
// movimiento del paseo también la estimulan. Con datos reales, cada señal aprende su
// propia mediana a partir de 4 registros.
const PRIOR = { despertar: 15, comida: 20, juego: 15, paseo: 10 };
const VENTANA = { despertar: 60, comida: 90, juego: 45, paseo: 45 };
const MIN_DATOS = 4;

function triggersDeAgenda() {
  return AGENDA.filter(a => a.trigger).map(a => ({ id:a.id, tipo:a.trigger, min:minDeHora(a.hora), titulo:a.titulo }));
}
// hora efectiva de hoy: la real si ya se marcó, si no la programada
function triggersHoy() {
  return triggersDeAgenda().map(t => {
    const real = D.horasReales[t.id];
    return { ...t, min: real ? minDeTs(real) : t.min, cumplido: !!real };
  }).sort((a,b) => a.min - b.min);
}
// aprende de TODO el historial: asocia cada caca a la señal previa más cercana
function modeloCaca() {
  const base = triggersDeAgenda();
  const datos = { despertar:[], comida:[], juego:[], paseo:[] };
  (S.historial || []).filter(r => r.tipo === "caca").forEach(r => {
    const m = minDeTs(r.t);
    let mejor = null;
    base.forEach(t => {
      const dif = m - t.min;
      if (dif >= 0 && dif <= VENTANA[t.tipo] && (!mejor || dif < mejor.dif)) mejor = { dif, tipo: t.tipo };
    });
    if (mejor) datos[mejor.tipo].push(mejor.dif);
  });
  const delays = {}, n = {};
  Object.keys(PRIOR).forEach(k => {
    const arr = datos[k].sort((a,b)=>a-b);
    n[k] = arr.length;
    delays[k] = arr.length >= MIN_DATOS ? arr[Math.floor(arr.length/2)] : PRIOR[k];
  });
  const total = Object.values(n).reduce((a,b)=>a+b,0);
  return { delays, n, total, aprendiendo: Object.keys(PRIOR).filter(k => n[k] < MIN_DATOS) };
}
function proximaCaca() {
  const { delays } = modeloCaca();
  const ahoraMin = minDeTs(Date.now());
  const cacasHoy = (D.registros || []).filter(r => r.tipo === "caca").map(r => minDeTs(r.t));
  for (const t of triggersHoy()) {
    if (ahoraMin > t.min + VENTANA[t.tipo]) continue;
    if (cacasHoy.some(m => m >= t.min && m <= t.min + VENTANA[t.tipo])) continue;
    return { pred: t.min + delays[t.tipo], trigger: t, delay: delays[t.tipo] };
  }
  return null;
}

// ═══════════════════ ALERTAS ═══════════════════
function aplazado(id) { return D.aplazos[id] && Date.now() < D.aplazos[id]; }
function aplazar(id) { D.aplazos[id] = Date.now() + APLAZO_MIN*60000; notifLimpiar(id); guardar(); render(); }

function alertasActivas() {
  const out = [];
  const ahora = new Date(), ahoraMin = ahora.getHours()*60 + ahora.getMinutes();

  // 1) actividades de la agenda cuya hora ya llegó
  AGENDA.forEach(a => {
    if (D.hechas[a.id] || aplazado(a.id)) return;
    const m = minDeHora(a.hora);
    if (ahoraMin < m) return;
    const t = TIPOS[a.tipo];
    out.push({
      id: a.id, clase: "a-" + a.tipo, emoji: t.emoji, msj: a.msj,
      sub: "Tocaba a las " + a.hora + " · atrasado " + fmt(ahoraMin - m),
      color: t.color, btn: a.paseo ? "Abrir paseo ✔" : "¡Listo! ✔",
      accion: a.paseo ? `irAPaseo('${a.id}')` : `marcarDesdeAlerta('${a.id}')`,
      atraso: ahoraMin - m,
    });
  });

  if (radarActivo(ahora)) {
    // 2) pipí (cada 2 h)
    const minsPipi = Math.floor((Date.now() - D.ultimaPipi)/60000);
    if (minsPipi >= PIPI_MIN && !aplazado("pipi")) {
      out.push({
        id: "pipi", clase: "a-pipi", emoji: "💧", msj: "Necesito hacer pipí, ¿me llevas al balcón? 🥺",
        sub: "Llevo " + fmt(minsPipi) + " sin ir (toca cada 2 h)",
        color: "#E2604C", btn: "Registrar pipí 💧", accion: "abrirRegistro('pipi')", atraso: minsPipi - PIPI_MIN,
      });
    }
    // 3) caca (según el modelo)
    const pc = proximaCaca();
    if (pc && !aplazado("caca")) {
      const rest = pc.pred - ahoraMin;
      if (pc.trigger.min <= ahoraMin && rest <= 0) {
        out.push({
          id: "caca", clase: "a-caca", emoji: "💩", msj: "Creo que me viene caca... ¡al balcón porfa! 😬",
          sub: "Estimada ~" + minATexto(pc.pred) + " · tras " + pc.trigger.titulo.toLowerCase(),
          color: "#C97A4A", btn: "Registrar caca 💩", accion: "abrirRegistro('caca')", atraso: -rest,
        });
      }
    }
    // 4) agua
    const horasAgua = (Date.now() - S.aguaUltima)/3600000;
    if (horasAgua >= AGUA_HORAS && !aplazado("agua")) {
      out.push({
        id: "agua", clase: "a-agua", emoji: "💧", msj: "¿Nos revisas el agua del bidón? 🥺",
        sub: S.aguaUltima ? "Última revisión hace " + fmt(horasAgua*60) : "Aún no se revisa hoy",
        color: "#6D8FD4", btn: "Está OK / la rellené ✔", accion: "aguaOk()", atraso: (horasAgua - AGUA_HORAS)*60,
      });
    }
  }
  return out.sort((a,b) => b.atraso - a.atraso);
}

function renderAlertas() {
  const el = document.getElementById("alertas");
  const lista = alertasActivas();
  if (!lista.length) {
    const pend = AGENDA.filter(a => !D.hechas[a.id]).length;
    el.innerHTML = `<div class="sin-alertas"><div class="t">✅ Todo al día</div>
      <div class="s">${pend ? "Sin alertas ahora · quedan " + pend + " actividades más tarde" : "¡Día completo! Las pewitas están felices 🐾"}</div></div>`;
    return;
  }
  el.innerHTML = lista.map(a => `
    <div class="alerta ${a.clase}">
      <div class="top"><div class="emoji">${a.emoji}</div>
        <div style="flex:1"><div class="msj">${a.msj}</div><div class="sub">${a.sub}</div></div></div>
      <div class="btns">
        <button class="principal" style="background:${a.color}" onclick="${a.accion}">${a.btn}</button>
        <button class="aplazar" onclick="aplazar('${a.id}')">Ahora no · ${APLAZO_MIN} min</button>
      </div>
    </div>`).join("");
}

let chipAbierto = null;
function verChip(c) { chipAbierto = (chipAbierto === c ? null : c); render(); }

function renderChips() {
  const el = document.getElementById("chipsEstado");
  const det = document.getElementById("chipDetalle");
  const noche = !radarActivo();
  const minsPipi = Math.floor((Date.now() - D.ultimaPipi)/60000);
  const restPipi = PIPI_MIN - minsPipi;
  const pc = proximaCaca();
  const horasAgua = (Date.now() - S.aguaUltima)/3600000;
  const cacasHoy = (D.registros||[]).filter(r=>r.tipo==="caca").length;
  const pipisHoy = (D.registros||[]).filter(r=>r.tipo==="pipi").length;

  const chips = [
    { c:"pipi", txt: noche ? "💧 Pipí · noche 🌙" : (restPipi > 0 ? "💧 Pipí en " + fmt(restPipi) : "💧 Pipí pendiente"), on: !noche && restPipi <= 0 },
    { c:"caca", txt: noche ? "💩 Caca · noche 🌙" : (pc ? "💩 ~" + minATexto(pc.pred) : "💩 sin ventana"), on: false },
    { c:"agua", txt: horasAgua >= AGUA_HORAS ? "🚰 Agua pendiente" : "🚰 Agua ok", on: horasAgua >= AGUA_HORAS },
  ];
  el.innerHTML = chips.map(c => `<button class="chip-e ${c.on?"alerta-on":""}" onclick="verChip('${c.c}')">${c.txt}</button>`).join("");

  if (!chipAbierto) { det.innerHTML = ""; return; }
  let h = "";
  if (chipAbierto === "pipi") {
    h = `<div class="chip-detalle"><b>💧 Pipí de Caluga</b> · hoy lleva ${pipisHoy}<br>
      ${noche ? "Modo noche (8:00–22:00 activo). El contador parte de nuevo a las 8:00."
              : "Última pipí hace " + fmt(minsPipi) + ". Aviso cada 2 horas."}
      <div class="acc"><button onclick="abrirRegistro('pipi')">Registrar pipí 💧</button></div></div>`;
  } else if (chipAbierto === "caca") {
    const m = modeloCaca();
    const base = m.total >= MIN_DATOS
      ? "Aprendido de " + m.total + " cacas registradas de Caluga."
      : "Aún usando lo típico de una cachorra de 4 meses (van " + m.total + " registros).";
    h = `<div class="chip-detalle"><b>💩 Caca de Caluga</b> · hoy lleva ${cacasHoy} (normal: 3 a 5 al día)<br>
      ${pc ? "Próxima estimada ~<b>" + minATexto(pc.pred) + "</b>, unos " + pc.delay + " min después de " + pc.trigger.titulo.toLowerCase() + "."
           : "Sin ventana activa: la próxima se abre con la siguiente comida, juego o paseo."}<br>
      <span style="font-size:12.5px">${base}</span>
      <div class="acc"><button onclick="abrirRegistro('caca')">Registrar caca 💩</button></div></div>`;
  } else if (chipAbierto === "agua") {
    h = `<div class="chip-detalle"><b>🚰 Agua de bidón</b><br>
      ${S.aguaUltima ? "Última revisión hace " + fmt(horasAgua*60) + "." : "Aún no se revisa hoy."}
      Se vuelve a preguntar cada ${AGUA_HORAS} horas.
      <div class="acc"><button onclick="aguaOk()">Está OK / la rellené ✔</button></div></div>`;
  }
  det.innerHTML = h;
}

// ── Registro rápido ──
let registroAbierto = null, instruccionActual = null, horaRegistro = null;
function abrirRegistro(tipo) {
  registroAbierto = tipo; instruccionActual = null; abierto.registro = true; chipAbierto = null;
  horaRegistro = horaTxt(Date.now());
  render();
  const el = document.getElementById("secciones"); if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
function setHoraRegistro(v) { horaRegistro = v; }
function contRegistro() {
  let h = `<div class="reg-botones">
    <button onclick="abrirRegistro('pipi')">💧 Hizo pipí</button>
    <button onclick="abrirRegistro('caca')">💩 Hizo caca</button></div>`;
  if (registroAbierto) {
    h += `<div class="pregunta">🕐 ¿A qué hora fue?</div>
      <div class="hora-edit"><input type="time" value="${horaRegistro||horaTxt(Date.now())}" onchange="setHoraRegistro(this.value)">
      <span style="font-size:12.5px;color:#7A6A5C">Déjala así si fue recién</span></div>`;
    const lugares = registroAbierto === "pipi" ? LUGARES_PIPI : LUGARES_CACA;
    h += `<div class="pregunta">${registroAbierto==="pipi"?"💧 ¿Dónde hizo pipí?":"💩 ¿Dónde hizo caca?"}</div><div class="chips">`;
    lugares.forEach(([v,l]) => { h += `<button onclick="registrar('${registroAbierto}','${v}')">${l}</button>`; });
    h += `</div>`;
  }
  if (instruccionActual) {
    h += `<div class="instruccion">${LIMPIEZA[instruccionActual]}`;
    if (instruccionActual === "caca-suelo") h += `<br><button class="btn-paseo" style="margin-top:8px" onclick="iniciarTimer('ventilar')">Activar aviso de ventilar (10 min) 🪟</button>`;
    h += `<br><button class="btn-paseo" style="margin-top:8px;border-color:#C9BCA9;color:#7A6A5C" onclick="cerrarInstruccion()">Entendido ✔</button></div>`;
  }
  const activos = (D.timers||[]).filter(t => !t.avisado || Date.now() - t.fin < 30*60000);
  activos.forEach(t => {
    const rest = Math.ceil((t.fin - Date.now())/60000);
    h += rest > 0
      ? `<div class="timer-chip">${t.emoji} ${t.nombre}: quedan ${rest} min <button class="quitar" onclick="quitarTimer(${t.id})">✕</button></div>`
      : `<div class="timer-chip listo">${t.emoji} ${t.nombre}: ¡listo! ${t.msjFin} <button class="quitar" onclick="quitarTimer(${t.id})">✕</button></div>`;
  });
  // ── lista editable de lo registrado hoy ──
  const regs = (D.registros||[]).slice().sort((a,b)=>a.t-b.t);
  h += `<div class="pregunta">📋 Registrado hoy ${regs.length ? "(toca la hora para corregirla)" : ""}</div>`;
  if (!regs.length) h += `<div class="vacio" style="padding:10px 0">Todavía sin registros hoy.</div>`;
  regs.forEach(r => {
    h += `<div class="ev-fila">
      <span>${r.tipo === "pipi" ? "💧" : "💩"}</span>
      <input type="time" value="${horaTxt(r.t)}" onchange="setHoraEvento('${r.id}', this.value)">
      <span class="ev-lugar">${LUGAR_TXT[r.lugar] || r.lugar}</span>
      <button class="ev-borrar" onclick="borrarEvento('${r.id}')">✕</button></div>`;
  });
  return h;
}
function tsDeHoraHoy(hhmm) {
  const [h,m] = hhmm.split(":").map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime();
}
function anotarEvento(tipo, lugar, ts) {
  const r = { id: String(Date.now()) + "-" + Math.floor(Math.random()*1000), t: ts || Date.now(), tipo, lugar };
  D.registros.push(r); S.historial.push({ ...r });
  if (S.historial.length > 800) S.historial = S.historial.slice(-800);
  if (tipo === "pipi") { recalcUltimaPipi(); notifLimpiar("pipi"); delete D.aplazos["pipi"]; }
  if (tipo === "caca") { notifLimpiar("caca"); delete D.aplazos["caca"]; }
}
function recalcUltimaPipi() {
  const pipis = (D.registros||[]).filter(r => r.tipo === "pipi").map(r => r.t);
  if (pipis.length) D.ultimaPipi = Math.max(...pipis);
}
function setHoraEvento(id, hhmm) {
  if (!hhmm) return;
  const ts = tsDeHoraHoy(hhmm);
  const r = (D.registros||[]).find(x => x.id === id); if (r) r.t = ts;
  const hh = (S.historial||[]).find(x => x.id === id); if (hh) hh.t = ts;
  recalcUltimaPipi(); guardar(); render();
}
function borrarEvento(id) {
  D.registros = (D.registros||[]).filter(x => x.id !== id);
  S.historial = (S.historial||[]).filter(x => x.id !== id);
  recalcUltimaPipi(); guardar(); render();
}
function setHoraActividad(id, hhmm) {
  if (!hhmm) return;
  D.horasReales[id] = tsDeHoraHoy(hhmm); D.hechas[id] = true;
  guardar(); render();
}
function registrar(tipo, lugar) {
  anotarEvento(tipo, lugar, horaRegistro ? tsDeHoraHoy(horaRegistro) : Date.now());
  registroAbierto = null; horaRegistro = null; instruccionActual = tipo + "-" + lugar;
  if (tipo === "pipi" && lugar === "suelo") iniciarTimer("orina");
  guardar(); render();
}
function cerrarInstruccion() { instruccionActual = null; render(); }
function iniciarTimer(clave) {
  const d = TIMER_DEFS[clave];
  D.timers.push({ id: Date.now(), clave, emoji:d.emoji, nombre:d.nombre, msjFin:d.msjFin, fin: Date.now()+d.min*60000, avisado:false });
  guardar(); render();
}
function quitarTimer(id) { D.timers = D.timers.filter(t => t.id !== id); guardar(); render(); }

// ── Agenda ──
let paseoAbierto = null;
function contAgenda() {
  const nHechas = AGENDA.filter(a=>D.hechas[a.id]).length;
  const ahoraMin = minDeTs(Date.now());
  let h = `<div class="progreso"><div class="barra"><div style="width:${nHechas/AGENDA.length*100}%"></div></div>
    <span>${nHechas}/${AGENDA.length}</span></div><div class="timeline">`;
  AGENDA.forEach(a => {
    const t = TIPOS[a.tipo], p = PERROS[a.perro];
    const hecha = !!D.hechas[a.id];
    const pasada = minDeHora(a.hora) < ahoraMin;
    h += `<div class="item">
      <div class="punto${hecha?" hecha":""}" style="border-color:${t.color}">${hecha?"✓":""}</div>
      <div class="card${hecha?" hecha":""}" style="background:${t.bg}">
      <div class="fila" onclick="${a.paseo?`abrirPaseo('${a.id}')`:`toggle('${a.id}')`}">
        <span class="hora" style="color:${t.color}">${a.hora}</span><span>${t.emoji}</span>
        <span class="titulo">${a.titulo}</span><span class="chip">${p.e} ${p.n}</span></div>`;
    if (a.nota) h += `<div class="nota">${a.nota}</div>`;
    if (a.comidaCaluga) h += contMetodo(a);
    if (a.paseo) h += contPaseo(a);
    if (hecha) h += `<div class="hora-edit" style="margin-top:6px">
      <span style="font-size:12.5px;font-weight:800;color:#5C8043">✔ Hecho a las</span>
      <input type="time" value="${horaTxt(D.horasReales[a.id] || Date.now())}" onchange="setHoraActividad('${a.id}', this.value)"></div>`;
    if (pasada && !hecha) h += `<div class="atraso">⚠ Pendiente — tocaba a las ${a.hora}</div>`;
    h += `</div></div>`;
  });
  return h + `</div>`;
}
function toggle(id) {
  D.hechas[id] = !D.hechas[id];
  if (D.hechas[id]) { D.horasReales[id] = Date.now(); delete D.aplazos[id]; notifLimpiar(id); }
  else delete D.horasReales[id];
  guardar(); render();
}
function marcarDesdeAlerta(id) { toggle(id); }
function irAPaseo(id) { abierto.agenda = true; paseoAbierto = id; render();
  const el = document.getElementById("secciones"); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); }

function kongUsadoHoy(excepto) { return Object.entries(D.metodos).some(([id,m]) => m === "Kong" && id !== excepto); }
function contMetodo(a) {
  const sel = D.metodos[a.id];
  let h = `<div class="metodo"><div class="pregunta">🐶 ¿Cómo come Caluga? (preferir en este orden)</div><div class="chips">`;
  METODOS.forEach(m => {
    const es = sel === m, bloq = m === "Kong" && kongUsadoHoy(a.id);
    const col = es ? "#C96FA0" : bloq ? "#C9BCA9" : "#7A6A5C";
    h += `<button style="border-color:${col};color:${es?"#fff":col};background:${es?"#C96FA0":"#fff"}" onclick="setMetodo('${a.id}','${m}')">${m}${bloq?" 🚫":""}</button>`;
  });
  h += `</div>`;
  if (sel === "Kong" && kongUsadoHoy(a.id)) h += `<div class="aviso-kong">⚠ El Kong ya se usó hoy — mejor cambiar (se le hace demasiado fácil).</div>`;
  else if (kongUsadoHoy(null) && !sel) h += `<div class="aviso-kong" style="color:#8A6A50">Kong ya usado hoy ✔ — elegir otra opción.</div>`;
  return h + `</div>`;
}
function setMetodo(id,m) { D.metodos[id] = (D.metodos[id] === m ? undefined : m); guardar(); render(); }

function contPaseo(a) {
  const caca = D.cacasLisa[a.id], pc = D.paseoCaluga[a.id] || {};
  if (paseoAbierto !== a.id) {
    const r = []; if (caca) r.push("Lisa ✔"); if (pc.pipi || pc.caca) r.push("Caluga ✔");
    return `<button class="btn-paseo" onclick="abrirPaseo('${a.id}')">Abrir checklist del paseo${r.length?" · "+r.join(" "):""}</button>`;
  }
  let h = `<div class="detalle"><h4>ANTES DE SALIR</h4>`;
  CHECK_PRE.forEach((c,i)=>{ const k=a.id+"-pre-"+i;
    h += `<label><input type="checkbox" ${D.checks[k]?"checked":""} onchange="toggleCheck('${k}')"><span class="${D.checks[k]?"tachado":""}">${c}</span></label>`; });
  h += `<h4>DURANTE</h4><div class="durante">🐶 Premiar a Caluga (1 pellet) después de que interactúe con perritos. Vigilar que <b>no coma nada</b> del suelo, pero dejarla olfatear. 🐕 Lisa hace pipí y caca solo acá.</div>`;
  h += `<h4>💩 ¿LISA HIZO CACA?</h4><div class="chips">`;
  [["no","No hizo","#9A8A78"],["normal","Sí, normal","#6E9A4E"],["blanda","Sí, blanda ⚠️","#E2604C"]].forEach(([v,l,c])=>{
    const s = caca===v; h += `<button style="border-color:${c};color:${s?"#fff":c};background:${s?c:"#fff"}" onclick="setCacaLisa('${a.id}','${v}')">${l}</button>`; });
  h += `</div>`;
  if (caca==="blanda") h += `<div class="alerta-blanda">Anotado. Si se repite en el próximo paseo, avisarle a Pía 📞</div>`;
  h += `<h4>🐶 ¿CALUGA HIZO EN EL PASEO?</h4><div class="chips">`;
  [["pipi","💧 Pipí","#4E9BB8"],["caca","💩 Caca","#C97A4A"]].forEach(([v,l,c])=>{
    const s = !!pc[v]; h += `<button style="border-color:${c};color:${s?"#fff":c};background:${s?c:"#fff"}" onclick="togglePaseoCaluga('${a.id}','${v}')">${l}${s?" ✔":""}</button>`; });
  h += `</div><div class="durante" style="margin-top:5px">Si hizo caca: recogerla con bolsa 💩.</div><h4>AL VOLVER</h4>`;
  CHECK_POST.forEach((c,i)=>{ const k=a.id+"-post-"+i;
    h += `<label><input type="checkbox" ${D.checks[k]?"checked":""} onchange="toggleCheck('${k}')"><span class="${D.checks[k]?"tachado":""}">${c}</span></label>`; });
  h += `<div class="acciones"><button class="listo" onclick="paseoListo('${a.id}')">Paseo listo ✔</button>
        <button class="cerrar" onclick="cerrarPaseo()">Cerrar</button></div></div>`;
  return h;
}
function abrirPaseo(id){ paseoAbierto = (paseoAbierto===id?null:id); render(); }
function cerrarPaseo(){ paseoAbierto = null; render(); }
function paseoListo(id){ D.hechas[id]=true; D.horasReales[id]=Date.now(); delete D.aplazos[id]; notifLimpiar(id); paseoAbierto=null; guardar(); render(); }
function toggleCheck(k){ D.checks[k] = !D.checks[k]; guardar(); render(); }
function setCacaLisa(id,v){ D.cacasLisa[id]=v; guardar(); render(); }
function togglePaseoCaluga(id,v) {
  if (!D.paseoCaluga[id]) D.paseoCaluga[id] = {};
  const nuevo = !D.paseoCaluga[id][v]; D.paseoCaluga[id][v] = nuevo;
  if (nuevo) anotarEvento(v, "paseo");
  guardar(); render();
}
function aguaOk() { S.aguaUltima = Date.now(); notifLimpiar("agua"); delete D.aplazos["agua"]; chipAbierto = null; guardar(); render(); }

// ── Semana ──
function contSemana() {
  const fechas = Object.keys(S.dias).sort();
  if (!fechas.length) return `<div class="vacio">Aún no hay registros esta semana.</div>`;
  let h = "";
  fechas.forEach(f => {
    const d = S.dias[f], [y,mo,da] = f.split("-").map(Number);
    const fecha = new Date(y,mo-1,da);
    const n = AGENDA.filter(a => d.hechas && d.hechas[a.id]).length;
    const regs = d.registros || [];
    const pipis = regs.filter(r=>r.tipo==="pipi"), cacas = regs.filter(r=>r.tipo==="caca");
    const det = l => l.map(r => horaTxt(r.t)+" "+(LUGAR_TXT[r.lugar]||r.lugar)).join(" · ");
    h += `<div class="dia"><h4>${DIAS[fecha.getDay()]} ${da}</h4><div class="reg">
      ✔ ${n}/${AGENDA.length} actividades<br>
      💧 ${pipis.length} pipí${pipis.length!==1?"s":""}${pipis.length?": "+det(pipis):""}<br>
      💩 ${cacas.length} caca${cacas.length!==1?"s":""}${cacas.length?": "+det(cacas):""}<br>`;
    AGENDA.filter(a=>a.paseo).forEach((p,i) => {
      const c = d.cacasLisa ? d.cacasLisa[p.id] : null;
      const txt = c==="normal"?"💩 normal": c==="blanda"?"💩 <b style='color:#C2503E'>blanda ⚠️</b>": c==="no"?"sin caca":"—";
      h += `🐕 Lisa, ${p.titulo.toLowerCase()}: ${txt}<br>`;
    });
    h += `</div></div>`;
  });
  return h + `<div class="pie">Las tareas se reinician cada lunes. El historial de caca/pipí se guarda siempre para la predicción.</div>`;
}

// ── Modelo ──
function contModelo() {
  const m = modeloCaca();
  const nom = { despertar:"Al despertar", comida:"Después de comer", juego:"Después de jugar", paseo:"Durante el paseo" };
  let h = `<div class="modelo-box">La app predice la caca de Caluga según cuánto suele demorar después de cada señal.
    Parte con valores típicos de una cachorra de 4 meses y los reemplaza por los suyos al juntar ${MIN_DATOS} registros de esa señal.</div>`;
  Object.keys(PRIOR).forEach(k => {
    const listo = m.n[k] >= MIN_DATOS;
    h += `<div class="dia"><h4 style="text-transform:none">${nom[k]}</h4><div class="reg">
      Demora estimada: <b>${m.delays[k]} min</b><br>
      ${listo ? "✅ Aprendido de " + m.n[k] + " registros de Caluga" : "⏳ Valor típico · " + m.n[k] + "/" + MIN_DATOS + " registros"}</div></div>`;
  });
  return h + `<div class="pie">Total de cacas registradas: ${m.total}</div>`;
}
function contReglas() {
  return `<div class="dia reglas"><ul>
    <li><b>Caca de Caluga = recogerla AL TIRO</b> (se la come). Al water con poco papel.</li>
    <li>Caluga come <b>5 veces al día, 30 g</b> (taza de 52 g → llenar hasta 82 g).</li>
    <li>Cuando comen juntas: <b>Caluga al corral</b> hasta que Lisa termine.</li>
    <li>Si Lisa no come, el plato va <b>encima del refri</b> para la próxima comida.</li>
    <li>Pregabalina de Lisa: <b>½ comprimido a las 9:00 y 20:00</b>, con omega 3 encima.</li>
    <li>Comidas de Caluga: <b>alfombra olfativa → botella → manta olfativa → Kong</b>. Kong máx. 1 vez al día.</li>
    <li>Lisa hace pipí y caca <b>solo en los paseos</b> (3 al día: mañana, tarde y noche).</li>
    <li>Cualquier cosa rara: llamar a Pía 📞</li>
  </ul></div>`;
}

// ═══════════════════ CICLO ═══════════════════
function ciclo() {
  const ahora = new Date();
  const minAhora = ahora.getHours()*60 + ahora.getMinutes();

  AGENDA.forEach(a => {
    if (D.hechas[a.id] || aplazado(a.id)) return;
    const m = minDeHora(a.hora);
    if (minAhora < m) return;
    const bloque = Math.floor((minAhora - m)/20);     // recuerda cada 20 min
    const clave = a.id + "-" + bloque;
    if (!NOTIF[clave]) { notifMarcar(clave); notificar(TIPOS[a.tipo].emoji + " " + a.titulo, a.msj, a.id); }
  });

  if (radarActivo(ahora)) {
    const minsPipi = Math.floor((Date.now() - D.ultimaPipi)/60000);
    if (minsPipi >= PIPI_MIN && !aplazado("pipi")) {
      const clave = "pipi-" + Math.floor(minsPipi/20);
      if (!NOTIF[clave]) { notifMarcar(clave); notificar("💧 Caluga", "Necesito hacer pipí, ¿me llevas al balcón? 🥺 (llevo " + fmt(minsPipi) + ")", "pipi"); }
    }
    const pc = proximaCaca();
    if (pc && !aplazado("caca")) {
      const rest = pc.pred - minAhora;
      if (pc.trigger.min <= minAhora && rest <= 5) {
        const clave = "caca-" + pc.trigger.id;
        if (!NOTIF[clave]) { notifMarcar(clave); notificar("💩 Caluga", "Creo que me viene caca... ¡al balcón porfa! 😬 (~" + minATexto(pc.pred) + ")", "caca"); }
      }
    }
    const horasAgua = (Date.now() - S.aguaUltima)/3600000;
    if (horasAgua >= AGUA_HORAS && !aplazado("agua")) {
      const clave = "agua-" + Math.floor(horasAgua);
      if (!NOTIF[clave]) { notifMarcar(clave); notificar("💧 Pewitas", "¿Nos revisas el agua del bidón? 🥺", "agua"); }
    }
  }

  let cambio = false;
  (D.timers||[]).forEach(t => {
    if (!t.avisado && Date.now() >= t.fin) { t.avisado = true; cambio = true; notificar(t.emoji + " " + t.nombre, t.msjFin, "timer-"+t.id); }
  });
  if (cambio) guardar();
  const foco = document.activeElement;
  if (foco && (foco.tagName === "INPUT" || foco.tagName === "SELECT")) return;  // no interrumpir edición
  render();
}

function render() { renderAlertas(); renderChips(); renderSecciones(); }

document.getElementById("fecha").textContent =
  new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});
revisarBanner();

conectarSync();
setInterval(ciclo, 20000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
